services:
  php:
    # noinspection ComposeUnknownValues
    image: ghcr.io/phpyh/php:${PHP_IMAGE_VERSION:?Make sure `PHP_IMAGE_VERSION` is declared in `.env`}
    user: ${CONTAINER_USER:-}
    environment:
      INSIDE_DEVCONTAINER: true
      HISTFILE: /workspace/var/.docker_history
      COMPOSER_CACHE_DIR: /workspace/var/.composer_cache
    tty: true
    init: true
    volumes:
      - .:/workspace:cached
    working_dir: /workspace

  nats:
    image: nats
    command: -c /etc/server.conf -p 4222 -m 8222
    volumes:
      - ./docker/nats/server.conf:/etc/server.conf

  nats-jwt:
    image: nats
    command: -c /etc/jwt-server.conf --name nats-jwt -p 4222 -m 8222
    volumes:
      - ./docker/nats/jwt-server.conf:/etc/jwt-server.conf

  # Token authentication: nats-server refuses a token next to the users of accounts, so it runs on its own.
  nats-token:
    image: nats
    command: --name nats-token -p 4222 --auth T0k3n

  # A cluster of two servers: each one announces both in INFO (connect_urls), for the tests of the discovered servers.
  nats-cluster-1:
    image: nats
    command: --name nats-cluster-1 -p 4222 --cluster_name test --cluster nats://0.0.0.0:6222 --routes nats://nats-cluster-2:6222

  nats-cluster-2:
    image: nats
    command: --name nats-cluster-2 -p 4222 --cluster_name test --cluster nats://0.0.0.0:6222 --routes nats://nats-cluster-1:6222

  # TLS with the self-signed certificates of docker/nats/tls: offered (with the monitoring to tell the TLS connections),
  # verifying the clients, and with the handshake before INFO.
  nats-tls:
    image: nats
    command: -c /etc/nats/tls-server.conf --name nats-tls -p 4222 -m 8222
    volumes:
      - ./docker/nats/tls-server.conf:/etc/nats/tls-server.conf
      - ./docker/nats/tls:/etc/nats/tls

  nats-mtls:
    image: nats
    command: -c /etc/nats/mtls-server.conf --name nats-mtls -p 4222
    volumes:
      - ./docker/nats/mtls-server.conf:/etc/nats/mtls-server.conf
      - ./docker/nats/tls:/etc/nats/tls

  nats-tls-first:
    image: nats
    command: -c /etc/nats/tls-first-server.conf --name nats-tls-first -p 4222
    volumes:
      - ./docker/nats/tls-first-server.conf:/etc/nats/tls-first-server.conf
      - ./docker/nats/tls:/etc/nats/tls

  nats-cli:
    image: bitnamilegacy/natscli:latest
